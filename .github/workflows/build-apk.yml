name: 编译安卓 APK

# 推送到 main（网页文件有变化）时自动编译，也可在 Actions 页面手动运行。
# 编译好的 APK 发布在 Releases，最新版下载地址：
#   https://github.com/zhengjy654321/Solid-geometry-drawing/releases/latest/download/Sogeo.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'docs/**', 'assets/**', 'capacitor.config.json', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 准备网页文件
        run: mkdir www && cp -r index.html css js docs www/
      - name: 生成安卓工程与图标
        run: |
          npm i --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/assets@3
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0d1526' --splashBackgroundColor '#0d1526'
          npx cap sync android
          # 版本号随每次编译递增，才能覆盖安装旧版
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: 编译并签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../Sogeo.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sogeo 1.0.${{ github.run_number }}
          body: 安卓安装包。下载 Sogeo.apk，在手机上打开安装（需允许“安装未知来源应用”）。
          files: Sogeo.apk
